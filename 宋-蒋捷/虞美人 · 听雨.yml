---
题目: 虞美人 · 听雨
朝代: 宋
作者: 蒋捷
诗词:
  - 少年听雨歌楼上，红烛昏罗帐。
  - 壮年听雨客舟中，江阔云低、断雁叫西风。
  - 而今听雨僧庐下，鬓已星星也。
  - 悲欢离合总无情，一任阶前、点滴到天明。
诗注: 本词以“听雨”为线索，通过少年歌楼、壮年客舟、暮年僧庐三幅具代表性的人生画面，概括词人一生的境遇与心路历程，折射出南宋覆亡、世事变迁的深沉沧桑。
小传: 蒋捷（约1245年－约1305年），字胜欲，号竹山，宋末元初阳羡（今江苏宜兴）人。度宗咸淳十年（1274年）进士。宋亡后深怀故国之痛，隐居不仕，浪迹江湖，人称“竹山先生”。其词多抒发亡国之痛与漂泊之感，风格清丽凄婉，与周密、王沂孙、张炎并称“宋末四大家”。
标签:
  - 诗词::代表作
  - 诗词::宋词三百首
